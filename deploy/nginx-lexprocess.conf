map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream lexprocess_backend {
    server unix:/run/lexprocess/gunicorn.sock;
}

server {
    listen 80;
    server_name lexprocess.online www.lexprocess.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lexprocess.online www.lexprocess.online;

    ssl_certificate /etc/letsencrypt/live/lexprocess.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexprocess.online/privkey.pem;

    client_max_body_size 50m;

    root /srv/lexprocess/lexprocess-frontend/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ^~ /assets/ {
        root /srv/lexprocess/lexprocess-frontend/build;
        rewrite ^/assets/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location /api/ {
        proxy_pass http://lexprocess_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://lexprocess_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://lexprocess_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias /srv/lexprocess/lexprocess_backend/staticfiles/;
    }

    location /media/ {
        alias /srv/lexprocess/lexprocess_backend/mediafiles/;
    }
}
